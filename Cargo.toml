[package]
name = "chartr-browser"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "GPL-3.0-or-later"
repository = "https://github.com/rengwu/chartr-browser"

[lib]
crate-type = ["cdylib"]

[workspace]
members = ["runtime", "sdk"]
resolver = "3"
exclude = ["vendor/wry"]

[dependencies]
chartr-native-plugin = { path = "sdk" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
wry = { path = "vendor/wry", version = "=0.56.1", default-features = false, features = ["os-webview"] }

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1

[profile.dev]
debug = 1
incremental = false

[[test]]
name = "macos_embedding"
harness = false

[target.'cfg(target_os = "macos")'.dev-dependencies]
host_wry = { package = "wry", version = "=0.56.1", default-features = false, features = ["os-webview"] }
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
libloading = "0.8"
tempfile = "3"
